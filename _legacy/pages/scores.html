<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score & Leaderboard — Playhouse Social</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <style>
    .leaderboard-table th { color: var(--cyan); }
    .leaderboard-row-me td { background: rgba(0,209,220,0.06); }
    .leaderboard-row-me td:first-child { border-left: 3px solid var(--cyan); }

    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: var(--r-full);
      font-size: 13px; font-weight: 700;
    }
    .rank-1 { background: rgba(245,166,35,0.15); color: var(--amber); }
    .rank-2 { background: rgba(176,176,176,0.12); color: #b0b0b0; }
    .rank-3 { background: rgba(205,127,50,0.12); color: #cd7f32; }
    .rank-other { color: var(--text-muted); font-size: 13px; padding: 0 6px; }

    .scores-list { font-size: 13px; line-height: 1.8; color: var(--text-secondary); }
    .scores-list .winner { color: var(--amber); font-weight: 600; }

    /* Clickable stat cards */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-4); margin-bottom: var(--sp-6); }
    @media (max-width: 700px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }

    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-5) var(--sp-6);
      text-align: center;
      cursor: pointer;
      transition: all var(--t-fast) var(--ease);
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,209,220,0.04);
      opacity: 0;
      transition: opacity var(--t-fast) var(--ease);
    }
    .stat-card:hover {
      border-color: var(--cyan);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,209,220,0.1);
    }
    .stat-card:hover::after { opacity: 1; }
    .stat-card .hint {
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--cyan);
      opacity: 0;
      margin-top: 4px;
      transition: opacity var(--t-fast) var(--ease);
    }
    .stat-card:hover .hint { opacity: 0.7; }
    .stat-card .stat-value {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--cyan);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .stat-card .stat-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); margin-top: var(--sp-1);
    }

    /* Popup shared styles */
    .popup-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      color: var(--white);
      margin-bottom: var(--sp-1);
    }
    .popup-subtitle {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: var(--sp-6);
    }
    .popup-close {
      position: absolute; top: var(--sp-5); right: var(--sp-5);
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r-full);
      background: var(--surface-3);
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      border: none;
      transition: all var(--t-fast) var(--ease);
    }
    .popup-close:hover { background: var(--status-red-bg); color: var(--status-red); }

    /* Hours breakdown table */
    .hours-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-3) 0;
      border-bottom: 1px solid var(--border);
      gap: var(--sp-4);
    }
    .hours-row:last-child { border-bottom: none; }
    .hours-game { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .hours-sessions { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .hours-bar-wrap { flex: 1; display: flex; align-items: center; gap: var(--sp-3); }
    .hours-bar-track { flex: 1; height: 6px; background: var(--surface-3); border-radius: var(--r-full); overflow: hidden; }
    .hours-bar-fill { height: 100%; background: var(--cyan); border-radius: var(--r-full); }
    .hours-val { font-family: var(--font-display); font-size: 1.1rem; color: var(--cyan); letter-spacing: 0.04em; white-space: nowrap; }

    /* Games list */
    .game-pill-grid { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .game-pill {
      display: inline-flex; align-items: center; gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-4);
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--r-full);
      font-size: 13px; font-weight: 500;
      color: var(--text-primary);
      transition: border-color var(--t-fast) var(--ease);
    }
    .game-pill:hover { border-color: var(--cyan); color: var(--cyan); }
    .game-pill .year { color: var(--text-muted); font-size: 11px; }

    /* Gamers list */
    .gamer-row {
      display: flex; align-items: center; gap: var(--sp-4);
      padding: var(--sp-3) 0;
      border-bottom: 1px solid var(--border);
    }
    .gamer-row:last-child { border-bottom: none; }
    .gamer-avatar {
      width: 36px; height: 36px; border-radius: var(--r-full);
      background: var(--surface-3); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--text-secondary);
      flex-shrink: 0; text-transform: uppercase;
    }
    .gamer-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .gamer-games { font-size: 12px; color: var(--text-muted); }

    /* Badges */
    .badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); }
    @media (max-width: 480px) { .badges-grid { grid-template-columns: repeat(2, 1fr); } }
    .badge-card {
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-4);
      text-align: center;
      transition: all var(--t-fast) var(--ease);
    }
    .badge-card.earned {
      border-color: var(--amber);
      background: var(--amber-glow);
    }
    .badge-card.locked { opacity: 0.45; filter: grayscale(0.6); }
    .badge-icon { font-size: 2rem; margin-bottom: var(--sp-2); display: block; }
    .badge-name { font-size: 12px; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
    .badge-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
    .badge-earned-tag {
      display: inline-block; margin-top: var(--sp-2);
      font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--amber);
    }
  </style>
</head>
<body>
<div class="app-shell" id="shell"></div>

<script>
// ---- Mock data ----
const SCORECARDS = [
  { game: 'Ark Nova (2021)',  date: '06:00 PM, 2 May', location: 'Starbucks, ECity',
    scores: [{name:'Maximus',score:87,winner:true},{name:'Prashast',score:85},{name:'Shivangi',score:80},{name:'Shreyansh',score:78}] },
  { game: 'Jaipur (2009)',   date: '06:00 PM, 3 May', location: 'Starbucks, ECity',
    scores: [{name:'Shivangi',score:80,winner:true},{name:'Shreyansh',score:78}] },
  { game: 'Scythe (2016)',   date: '06:00 PM, 4 May', location: 'Starbucks, ECity',
    scores: [{name:'Maximus',score:87,winner:true},{name:'Prashast',score:85},{name:'Shivangi',score:80},{name:'Shreyansh',score:78}] },
];

const LEADERBOARD = [
  { name:'Maximus',           phs:316, rank:1, hrs:37, games:163 },
  { name:'Perseus',           phs:308, rank:2, hrs:32, games:123 },
  { name:'Loki',              phs:306, rank:3, hrs:29, games:92  },
  { name:'Shreyansh Vats',    phs:298, rank:4, hrs:29, games:92, isMe:true },
  { name:'Shivangi Tripathi', phs:245, rank:5, hrs:24, games:74  },
  { name:'Prashast Vats',     phs:243, rank:6, hrs:21, games:32  },
  { name:'Nipun Verma',       phs:131, rank:7, hrs:18, games:28  },
  { name:'Arijit Roy',        phs:111, rank:8, hrs:19, games:28  },
];

const ME = LEADERBOARD.find(x => x.isMe);

// ---- Popup data ----
const HOURS_BREAKDOWN = [
  { game: 'Ark Nova (2021)',  sessions: 4, hours: 10 },
  { game: 'Scythe (2016)',    sessions: 3, hours: 7  },
  { game: 'Jaipur (2009)',    sessions: 5, hours: 4  },
  { game: 'Wyrmspan (2024)',  sessions: 2, hours: 5  },
  { game: 'Catan (1995)',     sessions: 2, hours: 3  },
];

const UNIQUE_GAMES = [
  { name: 'Ark Nova',  year: 2021 }, { name: 'Scythe',    year: 2016 },
  { name: 'Jaipur',   year: 2009 }, { name: 'Wyrmspan',  year: 2024 },
  { name: 'Catan',    year: 1995 }, { name: 'Azul',      year: 2017 },
];

const UNIQUE_GAMERS = [
  { name: 'Maximus',   games: 5 }, { name: 'Perseus',  games: 4 },
  { name: 'Loki',      games: 3 }, { name: 'Shivangi', games: 6 },
  { name: 'Prashast',  games: 4 }, { name: 'Nipun',    games: 2 },
];

const BADGES = [
  { icon:'🎲', name:'First Roll',      desc:'Played your first game session',         earned: true,  date:'Apr 2026' },
  { icon:'🔥', name:'On a Roll',       desc:'Played 5 sessions in a row',             earned: true,  date:'May 2026' },
  { icon:'📚', name:'Game Explorer',   desc:'Played 5 unique games',                  earned: true,  date:'May 2026' },
  { icon:'🤝', name:'Social Butterfly',desc:'Met 5 unique gamers',                    earned: true,  date:'May 2026' },
  { icon:'⏰', name:'Time Lord',       desc:'Accumulated 25+ hours of play',          earned: true,  date:'May 2026' },
  { icon:'👑', name:'Top 5',           desc:'Reached top 5 on the leaderboard',       earned: false  },
  { icon:'🏆', name:'Champion',        desc:'Won 10 game sessions',                   earned: false  },
  { icon:'🌟', name:'Veteran',         desc:'Member for 6+ months',                   earned: false  },
  { icon:'🎯', name:'Diverse Player',  desc:'Played 15 unique games',                 earned: false  },
];

// ---- Render helpers ----
function rankBadge(r) {
  if (r === 1) return `<span class="rank-badge rank-1">🥇</span>`;
  if (r === 2) return `<span class="rank-badge rank-2">🥈</span>`;
  if (r === 3) return `<span class="rank-badge rank-3">🥉</span>`;
  return `<span class="rank-other">${r}</span>`;
}

function renderScorecards() {
  return `<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden">
    <table class="data-table">
      <thead><tr>
        <th>Game name</th><th>Time & date</th><th>Location</th><th>Scores</th>
      </tr></thead>
      <tbody>
        ${SCORECARDS.map(s => `<tr>
          <td style="font-weight:600">${s.game}</td>
          <td style="white-space:nowrap;color:var(--text-secondary)">${s.date}</td>
          <td style="color:var(--text-secondary)">${s.location}</td>
          <td><div class="scores-list">${s.scores.map(p =>
            `<div class="${p.winner?'winner':''}">${p.winner?'👑 ':''}${p.name} — ${p.score}</div>`
          ).join('')}</div></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderLeaderboard() {
  const maxHrs = Math.max(...HOURS_BREAKDOWN.map(x => x.hours));
  return `
    <div class="stat-grid">
      <div class="stat-card" onclick="openPopup('hours')" title="Click to see breakdown">
        <div class="stat-value">${ME.hrs} hrs</div>
        <div class="stat-label">Total hours played</div>
        <div class="hint">tap to expand ↗</div>
      </div>
      <div class="stat-card" onclick="openPopup('games')" title="Click to see all games">
        <div class="stat-value">${UNIQUE_GAMES.length}</div>
        <div class="stat-label">Unique games played</div>
        <div class="hint">tap to expand ↗</div>
      </div>
      <div class="stat-card" onclick="openPopup('gamers')" title="Click to see all gamers">
        <div class="stat-value">${UNIQUE_GAMERS.length}</div>
        <div class="stat-label">Unique gamers met</div>
        <div class="hint">tap to expand ↗</div>
      </div>
      <div class="stat-card" onclick="openPopup('badges')" title="Click to see badges">
        <div class="stat-value">Apr 2026</div>
        <div class="stat-label">Gamer since</div>
        <div class="hint">tap to expand ↗</div>
      </div>
    </div>

    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden">
      <table class="data-table leaderboard-table">
        <thead><tr>
          <th>Rank</th><th>Player</th><th>PHS score</th><th>Hrs played</th><th>Games played</th>
        </tr></thead>
        <tbody>
          ${LEADERBOARD.map(p => `
            <tr class="${p.isMe?'leaderboard-row-me':''}">
              <td>${rankBadge(p.rank)}</td>
              <td style="font-weight:${p.isMe?'700':'500'};color:${p.isMe?'var(--cyan)':'var(--text-primary)'}">
                ${p.name}${p.isMe?' <span style="font-size:11px;color:var(--cyan);opacity:.7">(you)</span>':''}
              </td>
              <td style="font-family:var(--font-display);font-size:1.1rem;color:${p.rank<=3?'var(--amber)':'var(--text-primary)'}">${p.phs}</td>
              <td style="color:var(--text-secondary)">${p.hrs}</td>
              <td style="color:var(--text-secondary)">${p.games}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div style="margin-top:var(--sp-4);padding:var(--sp-4);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);font-size:12px;color:var(--text-muted)">
      <strong style="color:var(--cyan)">PHS Score formula:</strong>
      (40·√HR + 30·√GR + 30·√SR) × (1 + log(1 + D/30))
      &nbsp;—&nbsp; Normalised by weeks active so new players can compete fairly.
    </div>
  `;
}

// ---- Popup content builders ----
function popupHours() {
  const maxHrs = Math.max(...HOURS_BREAKDOWN.map(x => x.hours));
  const total  = HOURS_BREAKDOWN.reduce((s, x) => s + x.hours, 0);
  return `
    <div class="popup-title">Hours Played</div>
    <div class="popup-subtitle">Cumulative breakdown across all games · ${total} hrs total</div>
    ${HOURS_BREAKDOWN.map(g => `
      <div class="hours-row">
        <div style="min-width:140px">
          <div class="hours-game">${g.game}</div>
          <div class="hours-sessions">${g.sessions} session${g.sessions>1?'s':''}</div>
        </div>
        <div class="hours-bar-wrap">
          <div class="hours-bar-track">
            <div class="hours-bar-fill" style="width:${Math.round((g.hours/maxHrs)*100)}%"></div>
          </div>
          <div class="hours-val">${g.hours} hrs</div>
        </div>
      </div>
    `).join('')}
  `;
}

function popupGames() {
  return `
    <div class="popup-title">Unique Games Played</div>
    <div class="popup-subtitle">${UNIQUE_GAMES.length} games explored so far</div>
    <div class="game-pill-grid">
      ${UNIQUE_GAMES.map(g => `
        <div class="game-pill">
          🎲 ${g.name} <span class="year">${g.year}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function popupGamers() {
  return `
    <div class="popup-title">Unique Gamers Met</div>
    <div class="popup-subtitle">${UNIQUE_GAMERS.length} players you've gamed with</div>
    ${UNIQUE_GAMERS.map(g => `
      <div class="gamer-row">
        <div class="gamer-avatar">${g.name.slice(0,2)}</div>
        <div>
          <div class="gamer-name">${g.name}</div>
          <div class="gamer-games">Played together in ${g.games} session${g.games>1?'s':''}</div>
        </div>
      </div>
    `).join('')}
  `;
}

function popupBadges() {
  const earned = BADGES.filter(b => b.earned).length;
  return `
    <div class="popup-title">My Badges</div>
    <div class="popup-subtitle">${earned} of ${BADGES.length} badges earned · Gamer since Apr 2026</div>
    <div class="badges-grid">
      ${BADGES.map(b => `
        <div class="badge-card ${b.earned?'earned':'locked'}">
          <span class="badge-icon">${b.icon}</span>
          <div class="badge-name">${b.name}</div>
          <div class="badge-desc">${b.desc}</div>
          ${b.earned
            ? `<div class="badge-earned-tag">✓ ${b.date}</div>`
            : `<div class="badge-desc" style="margin-top:4px;color:var(--text-muted)">🔒 Locked</div>`
          }
        </div>
      `).join('')}
    </div>
  `;
}

// ---- Popup open/close ----
function openPopup(type) {
  const body = document.getElementById('stat-popup-body');
  const map  = { hours: popupHours, games: popupGames, gamers: popupGamers, badges: popupBadges };
  body.innerHTML = (map[type] || (() => ''))();
  document.getElementById('stat-popup').classList.add('open');
}
</script>

<script src="../js/app.js"></script>
<script src="../js/shell.js"></script>
<script>
document.getElementById('shell').innerHTML = buildShell('scores') + `
  <div class="page-body">
    <h1 class="page-title">Score &amp; Leaderboard</h1>
    <div class="tab-container">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('scorecards')">My scorecards</button>
        <button class="tab-btn" onclick="switchTab('leaderboard')">Leaderboard</button>
      </div>
      <div id="score-content"></div>
    </div>
  </div>

  <!-- Stat detail popup -->
  <div class="modal-overlay" id="stat-popup">
    <div class="modal" style="max-width:520px;max-height:80vh;overflow-y:auto;position:relative">
      <button class="popup-close" onclick="closeModal('stat-popup')">✕</button>
      <div id="stat-popup-body"></div>
    </div>
  </div>
` + closeShell();

function switchTab(tab) {
  const btns = document.querySelectorAll('.tab-btn');
  btns[0].classList.toggle('active', tab === 'scorecards');
  btns[1].classList.toggle('active', tab === 'leaderboard');
  document.getElementById('score-content').innerHTML =
    tab === 'scorecards' ? renderScorecards() : renderLeaderboard();
}

document.addEventListener('DOMContentLoaded', () => switchTab('scorecards'));
</script>
</body>
</html>
