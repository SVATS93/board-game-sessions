<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQs — Playhouse Social</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <style>
    .faq-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      transition: border-color var(--t-fast) var(--ease);
    }
    .faq-item.open { border-color: var(--border-accent); }
    .faq-question {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--sp-5) var(--sp-6);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      gap: var(--sp-4);
    }
    .faq-chevron {
      font-size: 18px;
      color: var(--cyan);
      transition: transform var(--t-base) var(--ease);
      flex-shrink: 0;
    }
    .faq-item.open .faq-chevron { transform: rotate(180deg); }
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--t-slow) var(--ease);
    }
    .faq-item.open .faq-answer { max-height: 400px; }
    .faq-answer-inner {
      padding: 0 var(--sp-6) var(--sp-5);
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      border-top: 1px solid var(--border);
      padding-top: var(--sp-4);
    }
  </style>
</head>
<body>
<div class="app-shell" id="shell"></div>

<script src="../js/app.js"></script>
<script src="../js/shell.js"></script>
<script>
const FAQS = [
  { q: 'How do I reserve a spot for a game session?', a: 'Go to Schedule → Upcoming Games. Click the chevron (›) on any game row to expand the details. You\'ll see the current booking status and a Reserve button. Click it, select whether you need a teaching session, and confirm. You\'ll appear in the players list once payment is confirmed.' },
  { q: 'What does "Needs teaching" mean on the player tiles?', a: 'When you reserve a game, you can indicate whether you already know the rules or need a walkthrough. Green tiles = players who know the game. Yellow/amber tiles = players who need a teaching session. This helps the session host plan the evening accordingly.' },
  { q: 'How is the PHS score calculated?', a: 'PHS Score = (40·√HR + 30·√GR + 30·√SR) × (1 + log(1 + D/30)), where HR = hours played per week, GR = unique games played per week, SR = unique gamers met per week, D = days since joining. The formula normalises for tenure so newer players can still compete with veterans.' },
  { q: 'What happens if a session is full?', a: 'You can join the waitlist by clicking "Join waitlist" on the game detail card. Your waitlist position will be shown in My Games. If a spot opens up (e.g. a cancellation), you\'ll be notified and bumped up in order.' },
  { q: 'How do I update my profile details?', a: 'Click "My Profile" in the left sidebar. You can update your first name, last name, mobile number, and email there. Hit the Update button to save changes.' },
  { q: 'What games are available to play?', a: 'Browse the full game collection in the Game Library section. You can see each game\'s BoardGameGeek stats, player count, time to play, complexity weight, and availability status.' },
  { q: 'Can I cancel a booking?', a: 'Cancellation policy details will be added by the admin. Please reach out through WhatsApp or Instagram (links in Community Guidelines) to request a cancellation.' },
];

document.getElementById('shell').innerHTML = buildShell('faqs') + `
  <div class="page-body">
    <h1 class="page-title">FAQs</h1>
    <div style="display:flex;flex-direction:column;gap:var(--sp-3);max-width:800px" id="faq-list">
      ${FAQS.map((f,i) => `
        <div class="faq-item" id="faq-${i}">
          <div class="faq-question" onclick="toggleFaq(${i})">
            <span>${f.q}</span>
            <span class="faq-chevron">⌄</span>
          </div>
          <div class="faq-answer">
            <div class="faq-answer-inner">${f.a}</div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>
` + closeShell();

function toggleFaq(i) {
  const item = document.getElementById('faq-' + i);
  const isOpen = item.classList.contains('open');
  // close all
  document.querySelectorAll('.faq-item').forEach(el => el.classList.remove('open'));
  if (!isOpen) item.classList.add('open');
}
</script>
</body>
</html>
