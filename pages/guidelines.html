<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Guidelines — Playhouse Social</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <style>
    .guideline-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-6);
    }
    .guideline-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: var(--sp-3);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .guideline-card p, .guideline-card li {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .guideline-card ul { padding-left: var(--sp-5); }
    .guideline-card li { margin-bottom: var(--sp-1); }
    .social-row {
      display: flex;
      gap: var(--sp-4);
      flex-wrap: wrap;
      margin-top: var(--sp-6);
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-5);
      border-radius: var(--r-full);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--t-fast) var(--ease);
    }
    .social-wa {
      background: rgba(37,211,102,0.12);
      color: #25d366;
      border: 1px solid rgba(37,211,102,0.25);
    }
    .social-wa:hover { background: rgba(37,211,102,0.2); transform:translateY(-1px); }
    .social-ig {
      background: rgba(225,48,108,0.1);
      color: #e1306c;
      border: 1px solid rgba(225,48,108,0.2);
    }
    .social-ig:hover { background: rgba(225,48,108,0.18); transform:translateY(-1px); }
  </style>
</head>
<body>
<div class="app-shell" id="shell"></div>

<script src="../js/app.js"></script>
<script src="../js/shell.js"></script>
<script>
document.getElementById('shell').innerHTML = buildShell('guidelines') + `
  <div class="page-body">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:var(--sp-4);margin-bottom:var(--sp-6)">
      <h1 class="page-title" style="margin-bottom:0">Community Guidelines</h1>
      <div class="social-row" style="margin-top:0">
        <a href="#" class="social-btn social-wa">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.534 5.858L0 24l6.334-1.507A11.946 11.946 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.89 0-3.663-.498-5.197-1.371l-.369-.22-3.762.895.945-3.668-.241-.381A9.96 9.96 0 012 12c0-5.514 4.486-10 10-10s10 4.486 10 10-4.486 10-10 10z"/></svg>
          Join on WhatsApp
        </a>
        <a href="#" class="social-btn social-ig">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          Follow on Instagram
        </a>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:var(--sp-4);max-width:800px">
      <div class="guideline-card">
        <h3>🎲 Respect the game & fellow players</h3>
        <ul>
          <li>Treat all players with kindness and patience, especially those learning new games.</li>
          <li>No unsolicited strategy advice unless asked — let people make their own moves.</li>
          <li>Keep rules disputes civil; the session host's decision is final.</li>
        </ul>
      </div>
      <div class="guideline-card">
        <h3>📅 Honour your booking</h3>
        <ul>
          <li>If you've reserved a seat, show up or cancel at least 24 hours in advance.</li>
          <li>No-shows without notice may affect your ability to book future sessions.</li>
          <li>Payment is required to confirm a reservation — this holds your seat.</li>
        </ul>
      </div>
      <div class="guideline-card">
        <h3>🏠 Respect the venue</h3>
        <ul>
          <li>Handle all game components with care. Damaged components must be reported to the host.</li>
          <li>Keep noise to a social level — we're guests in the venue.</li>
          <li>Order something from the venue — it's the least we can do for their hospitality!</li>
        </ul>
      </div>
      <div class="guideline-card">
        <h3>🌐 Community spirit</h3>
        <ul>
          <li>Playhouse Social is a welcoming space for all — no discrimination of any kind.</li>
          <li>Introduce yourself to newcomers and help them feel included.</li>
          <li>Share feedback constructively through the official channels.</li>
        </ul>
      </div>
      <div class="guideline-card">
        <h3>📱 Content & privacy</h3>
        <ul>
          <li>You may take photos/videos at sessions but always ask before posting others.</li>
          <li>Don't share personal details of other players without consent.</li>
          <li>Keep community channel discussions relevant to gaming and the community.</li>
        </ul>
      </div>
    </div>
  </div>
` + closeShell();
</script>
</body>
</html>
