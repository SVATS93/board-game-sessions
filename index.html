<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playhouse Social — Login</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    body {
      background: var(--black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
      position: relative;
      overflow: hidden;
    }

    /* Neon ambient background */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(0,209,220,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(245,166,35,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.5s var(--ease) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: var(--sp-8);
    }

    .login-logo img {
      width: 100%;
      max-width: 280px;
      height: auto;
      display: inline-block;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: var(--sp-8);
      box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,209,220,0.05);
    }

    /* Toggle between login and signup */
    .auth-toggle {
      display: flex;
      background: var(--surface-2);
      border-radius: var(--r-full);
      padding: 4px;
      margin-bottom: var(--sp-6);
    }
    .auth-toggle-btn {
      flex: 1;
      padding: var(--sp-2) var(--sp-4);
      border-radius: var(--r-full);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: all var(--t-base) var(--ease);
    }
    .auth-toggle-btn.active {
      background: var(--cyan);
      color: var(--black);
    }

    .auth-form { display: none; flex-direction: column; gap: var(--sp-5); }
    .auth-form.visible { display: flex; animation: fadeUp 0.3s var(--ease) both; }

    .divider {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin: var(--sp-2) 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      width: 100%;
      padding: var(--sp-3) var(--sp-5);
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-full);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all var(--t-fast) var(--ease);
    }
    .btn-google:hover {
      border-color: rgba(255,255,255,0.2);
      background: var(--surface-3);
      transform: translateY(-1px);
    }
    .btn-google svg { flex-shrink: 0; }

    .forgot-link {
      text-align: center;
      font-size: 13px;
      color: var(--cyan);
      cursor: pointer;
      margin-top: var(--sp-1);
    }
    .forgot-link:hover { text-decoration: underline; }

    .error-msg {
      background: var(--status-red-bg);
      border: 1px solid rgba(255,82,82,0.2);
      border-radius: var(--r-md);
      padding: var(--sp-3) var(--sp-4);
      font-size: 13px;
      color: var(--status-red);
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <img src="assets/logo.png" alt="Playhouse Social">
  </div>

  <div class="login-card">
    <!-- Toggle -->
    <div class="auth-toggle">
      <button class="auth-toggle-btn active" onclick="switchAuth('login')">Sign in</button>
      <button class="auth-toggle-btn" onclick="switchAuth('signup')">Create account</button>
    </div>

    <!-- Error message -->
    <div class="error-msg" id="error-msg"></div>

    <!-- Google login (works for both) -->
    <button class="btn-google" onclick="googleAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <!-- Login form -->
    <form class="auth-form visible" id="login-form" onsubmit="emailLogin(event)">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="login-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="padding: var(--sp-4)">Sign in</button>
      <div class="forgot-link" onclick="showForgotPassword()">Forgot password?</div>
    </form>

    <!-- Signup form -->
    <form class="auth-form" id="signup-form" onsubmit="emailSignup(event)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)">
        <div class="form-group">
          <label class="form-label">First name</label>
          <input type="text" class="form-input" id="signup-fname" placeholder="Shreyansh" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last name</label>
          <input type="text" class="form-input" id="signup-lname" placeholder="Vats" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="signup-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Mobile number</label>
        <input type="tel" class="form-input" id="signup-phone" placeholder="+91 98765 43210">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="signup-password" placeholder="Min 8 characters" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="padding: var(--sp-4)">Create account</button>
    </form>
  </div>
</div>

<script>
  function switchAuth(mode) {
    const btns = document.querySelectorAll('.auth-toggle-btn');
    const loginForm   = document.getElementById('login-form');
    const signupForm  = document.getElementById('signup-form');
    btns.forEach(b => b.classList.remove('active'));

    if (mode === 'login') {
      btns[0].classList.add('active');
      loginForm.classList.add('visible');
      signupForm.classList.remove('visible');
    } else {
      btns[1].classList.add('active');
      signupForm.classList.add('visible');
      loginForm.classList.remove('visible');
    }
    document.getElementById('error-msg').classList.remove('show');
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function emailLogin(e) {
    e.preventDefault();
    // Phase 2: Firebase signInWithEmailAndPassword
    // For now: mock redirect
    window.location.href = 'pages/profile.html';
  }

  function emailSignup(e) {
    e.preventDefault();
    // Phase 2: Firebase createUserWithEmailAndPassword
    window.location.href = 'pages/profile.html';
  }

  function googleAuth() {
    // Phase 2: Firebase signInWithPopup(googleProvider)
    window.location.href = 'pages/profile.html';
  }

  function showForgotPassword() {
    // Phase 2: Firebase sendPasswordResetEmail
    alert('Password reset email will be sent. (Firebase in Phase 2)');
  }
</script>
</body>
</html>
